version: '3.8'

services:
  app_tanavitrine:
    image: tanavitrine-app:latest
    restart: unless-stopped
    networks:
      - gravit_network
    ports:
      - target: 8000
        published: 8001
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 30s  # Aumentado para garantir estabilidade
        order: start-first
        failure_action: rollback
        monitor: 60s  # Monitorar por 60s antes de continuar
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        monitor: 30s
      restart_policy:
        condition: on-failure  # Só reinicia em caso de falha
        delay: 10s
        max_attempts: 5  # Mais tentativas
        window: 300s  # Janela maior para tentativas
      # RECURSOS PARA EVITAR SOBRECARGA
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=gravit_network"
        - "traefik.http.routers.tanavitrine.rule=Host(`tanavitrine.com.br`)"
        - "traefik.http.routers.tanavitrine.entrypoints=websecure"
        - "traefik.http.routers.tanavitrine.tls=true"
        - "traefik.http.routers.tanavitrine.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tanavitrine.loadbalancer.server.port=8001"
        # STICKY SESSIONS PARA CSRF TOKENS - HABILITADO
        - "traefik.http.services.tanavitrine.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.tanavitrine.loadbalancer.sticky.cookie.name=tanavitrine_server"
        - "traefik.http.services.tanavitrine.loadbalancer.sticky.cookie.secure=true"
        - "traefik.http.services.tanavitrine.loadbalancer.sticky.cookie.httpOnly=true"
        # HEALTH CHECK NO LOAD BALANCER
        - "traefik.http.services.tanavitrine.loadbalancer.healthcheck.path=/up"
        - "traefik.http.services.tanavitrine.loadbalancer.healthcheck.interval=30s"
        - "traefik.http.services.tanavitrine.loadbalancer.healthcheck.timeout=5s"
        # REDIRECIONAMENTO HTTP -> HTTPS
        - "traefik.http.routers.tanavitrine-http.rule=Host(`tanavitrine.com.br`)"
        - "traefik.http.routers.tanavitrine-http.entrypoints=web"
        - "traefik.http.routers.tanavitrine-http.middlewares=redirect-https@docker"
    # VOLUMES PARA LOGS E STORAGE LOCAL
    volumes:
      - logs:/var/www/html/storage/logs:rw
      - storage:/var/www/html/storage/app:rw
    environment:
      - TRUST_CLOUDFLARE=true
      - CONTAINER_ROLE=app_tanavitrine
      - WWWUSER=1000
      - WWWGROUP=1000
      # APLICAÇÃO BASE
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://tanavitrine.com.br
      # CACHE E SESSIONS DISTRIBUÍDOS
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      # REDIS LOCAL CONFIGURATION
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_CLIENT=phpredis
      - REDIS_PREFIX=tanavitrine_prod_
      - REDIS_DB=0
      - REDIS_CACHE_CONNECTION=cache
      - REDIS_CACHE_DB=1
      - REDIS_TIMEOUT=5
      - REDIS_READ_TIMEOUT=10
      # ARMAZENAMENTO LOCAL
      - FILESYSTEM_DISK=public
      # AWS keys removidas para usar apenas storage local
      # QUEUE
      - QUEUE_CONNECTION=redis
      # OCTANE
      - OCTANE_SERVER=frankenphp
      - OCTANE_HTTPS=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  queue_tanavitrine:
    image: tanavitrine-app:latest
    restart: unless-stopped
    networks:
      - gravit_network
    # Redis agora é externo (Valkey Serverless)
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    volumes:
      - logs:/var/www/html/storage/logs:rw
      - storage:/var/www/html/storage/app:rw
    environment:
      - CONTAINER_ROLE=queue_tanavitrine
      - WWWUSER=1000
      - WWWGROUP=1000
      # MESMAS CONFIGURAÇÕES DO APP
      - APP_ENV=production
      - APP_DEBUG=false
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_CLIENT=phpredis
      - REDIS_PREFIX=tanavitrine_prod_
      - REDIS_DB=0
      - REDIS_CACHE_CONNECTION=cache
      - REDIS_CACHE_DB=1
      - REDIS_TIMEOUT=5
      - REDIS_READ_TIMEOUT=10
      - QUEUE_CONNECTION=redis
    entrypoint: ["/app/docker/scripts/entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--timeout=90"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[a]rtisan queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  gravit_network:
    external: true

# VOLUMES LOCAIS
volumes:
  logs:
    driver: local
  storage:
    driver: local
  public:
    driver: local
