[www]
; Configurações de usuário e grupo
user = www-data
group = www-data

; Configurações de socket
listen = /run/php-fpm-tanavitrine.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 65535

; Configurações de processo
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500
pm.process_idle_timeout = 10s
pm.status_path = /status

; Configurações de timeout
request_terminate_timeout = 120s
request_slowlog_timeout = 5s

; Configurações de log
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
access.log = /dev/stdout
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
php_flag[display_errors] = off
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Configurações de memória
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 120M
php_admin_value[post_max_size] = 120M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 60
php_admin_value[output_buffering] = 4096
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600

; Configurações de opcache
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 4000
php_admin_value[opcache.revalidate_freq] = 60
php_admin_value[opcache.enable_cli] = 1

; Configurações de sessão
php_admin_value[session.gc_maxlifetime] = 1440
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100

; Configurações de segurança
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[display_startup_errors] = Off
php_admin_value[log_errors] = On

; Configurações de status
slowlog = /var/log/php-fpm/slow.log

; FastCGI Settings
env[SCRIPT_FILENAME] = $document_root$fastcgi_script_name
env[PATH_INFO] = $fastcgi_path_info
env[HTTP_HOST] = $http_host
env[SERVER_NAME] = $server_name
env[SERVER_PORT] = $server_port
env[SERVER_PROTOCOL] = $server_protocol
env[REQUEST_METHOD] = $request_method
env[QUERY_STRING] = $query_string
env[CONTENT_TYPE] = $content_type
env[CONTENT_LENGTH] = $content_length
env[REMOTE_ADDR] = $remote_addr
env[REMOTE_PORT] = $remote_port
env[SERVER_ADDR] = $server_addr
env[SERVER_SOFTWARE] = nginx
env[HTTPS] = $https
env[HTTP_X_FORWARDED_FOR] = $http_x_forwarded_for
env[HTTP_X_FORWARDED_PROTO] = $http_x_forwarded_proto
env[HTTP_X_FORWARDED_PORT] = $http_x_forwarded_port

; Configurações de timezone
php_admin_value[date.timezone] = America/Sao_Paulo
