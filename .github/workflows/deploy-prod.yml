name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: tanavitrine
  DEPLOY_PATH: /root/tanavitrine
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔐 Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -

      - name: 🔧 Add VPS to known hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "✅ VPS adicionada ao known_hosts"
              exit 0
            fi
            echo "⏳ Falha ao resolver/acessar VPS (tentativa $i/5). Aguardando 5s..."
            sleep 5
          done
          echo "❌ Não foi possível adicionar a VPS ao known_hosts após 5 tentativas."
          exit 1

      - name: 🚀 Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'
            set -e

            echo "📂 Navegando para o diretório do projeto..."
            cd /root/tanavitrine

            echo "📥 Fazendo pull das alterações..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Construindo nova imagem Docker..."
            docker build -t tanavitrine-app:latest .

            echo "🔄 Atualizando stack no Swarm..."
            docker stack deploy -c docker-compose.app.yml tanavitrine_app --with-registry-auth

            echo "⚡ Forçando atualização dos serviços para usar a nova imagem..."
            docker service update --force tanavitrine_app_app_tanavitrine
            docker service update --force tanavitrine_app_queue_tanavitrine

            echo "⏳ Aguardando serviço estabilizar..."
            sleep 30

            echo "📊 Executando migrações..."
            docker exec $(docker ps -q --filter "name=tanavitrine_app_app_tanavitrine" --filter "status=running" | head -1) php artisan migrate --force

            echo "🗺️ Gerando sitemap..."
            docker exec $(docker ps -q --filter "name=tanavitrine_app_app_tanavitrine" --filter "status=running" | head -1) php artisan sitemap:generate

            echo "✅ Validando se o sitemap foi gerado..."
            docker exec $(docker ps -q --filter "name=tanavitrine_app_app_tanavitrine" --filter "status=running" | head -1) ls -l public/sitemap.xml

            echo "🔍 Verificando status dos serviços..."
            docker service ls | grep tanavitrine

            echo "🧹 Limpando imagens e cache antigos..."
            docker image prune -f --filter "until=48h"
            docker builder prune -f --filter "until=168h"

            echo "✅ Deploy concluído com sucesso!"
          DEPLOY_SCRIPT

      - name: 📊 Health Check
        run: |
          echo "Aguardando aplicação iniciar..."
          sleep 15
          for i in 1 2 3; do
            if curl -sf https://tanavitrine.com.br/up; then
              echo "✅ Health check OK!"
              exit 0
            fi
            echo "⏳ Tentativa $i falhou, aguardando 10s..."
            sleep 10
          done
          echo "⚠️ Health check falhou após 3 tentativas"
          exit 1

      - name: 🧹 Stop SSH Agent
        if: always()
        shell: bash
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k
          fi
