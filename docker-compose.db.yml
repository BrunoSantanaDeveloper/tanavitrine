version: '3.8'

services:
  tanavitrine_db:
    image: mysql:8.0
    restart: unless-stopped
    networks:
      - gravit_network
    volumes:
      - db_tnvt_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=62@YhHf0EA
      - MYSQL_DATABASE=tnvt_bd
      - MYSQL_USER=usr_tnvt
      - MYSQL_PASSWORD=62@YhHf0EA
      - TZ=America/Sao_Paulo
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=2G
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "usr_tnvt", "-p62@YhHf0EA"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_tnvt_data:
    driver: local

networks:
  gravit_network:
    external: true
