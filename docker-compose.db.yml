version: '3.8'

services:
  tanavitrine_db:
    image: mysql:8.0
    networks:
      - minha_rede
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=vF3tK9pL2mN4x
      - MYSQL_DATABASE=tanavitrine
      - MYSQL_USER=vtf_user
      - MYSQL_PASSWORD=vF3tK9pL2mN4x
      - TZ=America/Sao_Paulo
    ports:
      - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=2G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "vtf_user", "-pvF3tK9pL2mN4x"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local

networks:
  minha_rede:
    external: true
